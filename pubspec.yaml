name: barrr
description: تطبيق البطريق — خدمات سيارات (عميل وفني) على Flutter وFirebase.
publish_to: "none"
version: 1.0.0+11

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.6
  geolocator: ^13.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  http: ^1.2.2
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  just_audio: ^0.9.34
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  archive: 4.5.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/logo.png
  web:
    generate: true
    image_path: assets/branding/logo.png
    background_color: "#FFFFFF"
    theme_color: "#0B1F3A"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
