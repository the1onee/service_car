name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  flutter:
    name: Flutter unit/widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  rules-smoke:
    name: Firestore rules smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  rules-emulator:
    name: Firestore rules emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: rules-test
      - run: npx -y firebase-tools@14 emulators:exec --only firestore --project demo-barrr "node --test rules-test/rules.test.js"
