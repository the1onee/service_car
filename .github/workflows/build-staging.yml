name: Build staging app

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android cmdline-tools and packages
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "${SDK_ROOT}/cmdline-tools"
          rm -rf "${SDK_ROOT}/cmdline-tools/latest"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Point Flutter at Android SDK
        run: flutter config --android-sdk "$ANDROID_HOME"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build isolated staging APK
        run: >-
          flutter build apk --debug
          --flavor staging
          --dart-define=APP_ENV=staging
          --dart-define=BARRR_API_BASE=https://api-staging.31.220.90.124.nip.io

      - uses: actions/upload-artifact@v4
        with:
          name: albatariq-staging-android
          path: build/app/outputs/flutter-apk/app-staging-debug.apk
          retention-days: 14
